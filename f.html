<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14112a">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>افتقاد · اجتماع أبو سيفين للشباب</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=Lalezar&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#14112a;color:#f1eefc;font-family:'Readex Pro',system-ui,sans-serif;-webkit-text-size-adjust:100%;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 30px)}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;justify-content:center;font:400 17px 'Lalezar',sans-serif;color:#c9b8ff;margin:2px 0 8px}
.logo img{width:30px;height:30px;border-radius:50%}
.badge{display:inline-block;background:#3b2c86;color:#e9e2ff;font-size:12px;border-radius:999px;padding:3px 11px}
h1{font:400 30px/1.2 'Lalezar',sans-serif;margin:8px 0 2px;color:#fff}
.hs{font-size:14px;color:#c9c2e6;margin:0 0 8px;line-height:1.6}
.prog{height:8px;border-radius:8px;background:#2c2552;overflow:hidden;margin:6px 0 4px}.prog i{display:block;height:100%;background:#2fb675;width:0;transition:width .3s}
.pt{font-size:12.5px;color:#a9a2c8;margin-bottom:12px}
.flt{display:flex;gap:6px;margin-bottom:10px}.flt button{border:0;background:#221d3d;color:#e9e2ff;border-radius:999px;padding:7px 13px;font:600 13px 'Readex Pro';cursor:pointer}.flt .on{background:#f3c96b;color:#2a1660}
.p{background:#1f1a3a;border-radius:16px;padding:12px;margin-bottom:10px;border:1.5px solid transparent}
.p.done{border-color:#2fb675;background:#17302a}
.p h3{margin:0;font:600 16px 'Readex Pro';display:flex;align-items:center;gap:6px}.p h3 .ok{color:#2fb675}
.p .i{font-size:12.5px;color:#b9b2d8;margin:3px 0 0;line-height:1.7}
.a{display:flex;gap:6px;margin:9px 0 2px}.a a{flex:1;text-align:center;text-decoration:none;border-radius:10px;padding:9px 4px;font:700 13px 'Readex Pro';background:#25c26a;color:#062a17}.a a.m{background:#2c2552;color:#e9e2ff}.a a.c{background:#8b7cf6;color:#140c38}
.q{display:flex;align-items:center;gap:6px;margin-top:8px}.q b{flex:none;width:56px;font-size:12.5px;color:#c9c2e6;font-weight:600}
.q button{flex:1;border:0;border-radius:9px;padding:9px 2px;font:600 12.5px 'Readex Pro';background:#2c2552;color:#e9e2ff;cursor:pointer}
.q button.on{background:#2fb675;color:#062a17}.q button.on.bad{background:#e0473f;color:#fff}.q button.on.mid{background:#f0a432;color:#2a1660}
textarea{width:100%;margin-top:8px;border:1.5px solid #3a3366;background:#15112b;color:#fff;border-radius:10px;padding:9px 10px;font:14px 'Readex Pro';resize:vertical;min-height:40px}
.sv{font-size:11px;color:#7be0ab;margin-top:3px;min-height:14px}
.msg{text-align:center;padding:60px 10px;color:#c9c2e6;line-height:1.8;font-size:15px}.msg b{display:block;font:400 26px 'Lalezar';color:#fff;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:#f3c96b;color:#2a1660;font-weight:700;border-radius:999px;padding:9px 18px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.ft{text-align:center;font-size:12px;color:#7d76a0;margin-top:18px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><img src="icon-192.png" alt="">اجتماع أبو سيفين للشباب</div>
  <div id="load" class="msg">بيحمّل…</div>
  <div id="err" class="msg" hidden><b>🔒 اللينك ده مش شغال</b>يمكن اتقفل أو اتمسح. كلّم اللي بعتهولك.</div>
  <div id="main" hidden>
    <span class="badge" id="by"></span>
    <h1 id="hi"></h1>
    <p class="hs" id="hs"></p>
    <div class="prog"><i id="pg"></i></div><div class="pt" id="pt"></div>
    <div class="flt" id="flt"></div>
    <div id="list"></div>
    <p class="ft">لما تكلّم حد علّم عليه هنا، وده بيوصل لخدام الاجتماع على طول. شكراً على تعبك ❤️</p>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
  var CFG={"apiKey": "AIzaSyCI2Joji2q_SrU1-TtRBEc1ZhgtbQNz95E", "authDomain": "abu-sefein-youth.firebaseapp.com", "projectId": "abu-sefein-youth", "storageBucket": "abu-sefein-youth.firebasestorage.app", "messagingSenderId": "884482612914", "appId": "1:884482612914:web:c5ec6c6eafacb26f7933ab"};firebase.initializeApp(CFG);var db=firebase.firestore();
  var id=(location.hash||'').replace(/^#/,'').replace(/[^A-Za-z0-9]/g,'');
  function $(i){return document.getElementById(i);}
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
  var AD='٠١٢٣٤٥٦٧٨٩';function ar(n){return String(n).replace(/\d/g,function(d){return AD[d]});}
  function first(n){return String(n||'').trim().split(/\s+/)[0]||'';}
  function intl(x){x=String(x||'').replace(/[٠-٩]/g,function(c){return AD.indexOf(c)}).replace(/\D/g,'');return /^0\d{10}$/.test(x)?'2'+x:x;}
  var MON=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  function dm(d){var q=String(d||'').split('-');return q.length===3?ar(+q[2])+' '+MON[+q[1]-1]:'';}
  var tt=null;function toast(t){var x=$('toast');x.textContent=t;x.hidden=false;clearTimeout(tt);tt=setTimeout(function(){x.hidden=true;},1600);}
  function fail(){$('load').hidden=true;$('main').hidden=true;$('err').hidden=false;}
  if(!id||id.length<12){fail();return;}
  var D=null,flt='',pend={};
  var Q=[['c','كلّمته؟',[['y','✓ أيوه',''],['n','مردّش','mid'],['w','الرقم غلط','bad']]],['v','زُرته؟',[['y','✓ أيوه',''],['n','لسه','mid']]],['j','هييجي؟',[['y','✓ أيوه',''],['m','مش عارف','mid'],['n','لأ','bad']]]];
  function stNext(st,k,val){var ns=Object.assign({},st),now=Date.now(),h=Array.isArray(st.h)?st.h.slice():[];
    if(!h.length){var a0=st.at||now;if(st.c){var e0={k:'c',r:st.c,at:a0};if(st.j)e0.j=st.j;h.push(e0);}if(st.v==='y')h.push({k:'v',r:'y',at:a0});}
    if(val==null)delete ns[k];else ns[k]=val;var last=h.length?Object.assign({},h[h.length-1]):null,fresh=!!(last&&now-last.at<6e5);
    if(k==='c'||k==='v'){if(val==null){if(fresh&&last.k===k)h.pop();}else if(k==='c'||val==='y'){if(fresh&&last.k===k){last.r=val;last.at=now;h[h.length-1]=last;}else h.push({k:k,r:val,at:now});}}
    else if(k==='j'){if(last&&now-last.at<432e5){if(val==null)delete last.j;else last.j=val;h[h.length-1]=last;}else if(val!=null)h.push({k:'c',r:'y',j:val,at:now});}
    if(h.length>30)h=h.slice(-30);ns.h=h;ns.at=now;return ns;}
  function st(n){return Object.assign({},(D.st||{})[n]||{},pend[n]||{});}
  function done(s){return s.c==='y'||s.v==='y';}
  function save(n,s){pend[n]=s;var u={};u['st.'+n]=s;u.sa=firebase.firestore.FieldValue.serverTimestamp();
    return db.collection('fu').doc(id).update(u).then(function(){toast('اتسجّل ✓');},function(e){delete pend[n];toast(/permission/.test(e&&e.code||'')?'اللينك اتقفل 🔒':'محصلش حفظ، جرّب تاني');render();});}
  function render(){var a=document.activeElement;if(a&&a.tagName==='TEXTAREA')return;
    var ns=Object.keys(D.p||{}).sort(function(x,y){return x-y}),k=ns.filter(function(n){return done(st(n))}).length;
    $('by').textContent='من '+(D.byName||'خدام الاجتماع');$('hi').textContent='أهلاً يا '+first(D.to)+' 👋';
    $('hs').textContent='دول '+ar(ns.length)+' من شباب الاجتماع، محتاجين نسأل عليهم ونطمّن ونعزمهم ييجوا.';
    $('pg').style.width=(ns.length?k/ns.length*100:0)+'%';$('pt').textContent='خلّصت '+ar(k)+' من '+ar(ns.length);
    var f=$('flt');f.textContent='';[['','الكل '+ar(ns.length)],['left','لسه '+ar(ns.length-k)],['done','خلصوا '+ar(k)]].forEach(function(x){var b=el('button',flt===x[0]?'on':'',x[1]);b.type='button';b.onclick=function(){flt=x[0];render();};f.appendChild(b);});
    var L=$('list');L.textContent='';
    ns.forEach(function(n){var x=D.p[n],s=st(n),dn=done(s);if(flt==='left'&&dn)return;if(flt==='done'&&!dn)return;
      var c=el('div','p'+(dn?' done':''));var h=el('h3',null,x.name);if(dn)h.appendChild(el('span','ok','✓'));c.appendChild(h);
      var inf=[x.phone,[x.region,x.addr].filter(Boolean).join('، '),x.age?ar(x.age)+' سنة':'',x.fam,x.last?'آخر مرة جه '+dm(x.last):''].filter(Boolean).join(' · ');if(inf)c.appendChild(el('p','i',inf));
      var ac=el('div','a');if(x.phone){var t=el('a','c','📞 اتصل');t.href='tel:'+x.phone;ac.appendChild(t);var w=el('a',null,'واتساب');w.href='https://wa.me/'+intl(x.phone)+'?text='+encodeURIComponent('أهلاً يا '+first(x.name)+' 👋 '+(D.to?'أنا '+first(D.to)+' من ':'')+'اجتماع أبو سيفين للشباب. وحشتنا! عامل إيه؟');w.target='_blank';w.rel='noopener';ac.appendChild(w);}
      if(x.addr||x.region){var m=el('a','m','📍 العنوان');m.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([x.addr,x.region].filter(Boolean).join(' '));m.target='_blank';m.rel='noopener';ac.appendChild(m);}
      if(ac.children.length)c.appendChild(ac);
      Q.forEach(function(q){var r=el('div','q');r.appendChild(el('b',null,q[1]));q[2].forEach(function(o){var on=s[q[0]]===o[0];var b=el('button',(on?'on ':'')+o[2],o[1]);b.type='button';
        b.onclick=function(){save(n,stNext(st(n),q[0],on?null:o[0]));render();};r.appendChild(b);});c.appendChild(r);});
      var ta=el('textarea');ta.placeholder='ملاحظة (اختياري) — مثلاً: عنده امتحانات، هييجي الأسبوع الجاي…';ta.maxLength=300;ta.value=s.t||'';var sv=el('div','sv');var tm=null;
      function keep(){var ns3=Object.assign({},st(n));var v=ta.value.trim().slice(0,300);if((ns3.t||'')===v)return;if(v)ns3.t=v;else delete ns3.t;ns3.at=Date.now();save(n,ns3).then(function(){sv.textContent='✓ اتحفظت';});}
      ta.oninput=function(){clearTimeout(tm);sv.textContent='';tm=setTimeout(keep,1200);};ta.onblur=function(){clearTimeout(tm);keep();setTimeout(render,50);};
      c.appendChild(ta);c.appendChild(sv);L.appendChild(c);});
    if(!L.children.length)L.appendChild(el('p','msg',flt==='left'?'خلّصت الكل 👏 ربنا يعوّض تعبك':'لسه مفيش'));}
  db.collection('fu').doc(id).onSnapshot(function(d){if(!d.exists){fail();return;}D=d.data();if(!D.open||!D.pub){fail();return;}
    Object.keys(pend).forEach(function(n){var r=(D.st||{})[n]||{};if(JSON.stringify(r)===JSON.stringify(pend[n]))delete pend[n];});
    $('load').hidden=true;$('err').hidden=true;$('main').hidden=false;render();},function(){fail();});
})();
</script>
</body>
</html>
