<script>
/* ===== conference engine (shared by c.html and the app) ===== */
var CF=(function(){
  var C={START:'2026-11-22',EARLY:'2026-12-06',END:'2027-01-24',CAP:50,DEP:300,PAYTO:'01201346441',
    TITLE:'مؤتمر إسكندرية',WHEN:'الجمعة ٦ – الأحد ٨ فبراير ٢٠٢٧',
    BASE:{s:1500,g:1800},DISC:{a:0,f:50,e:100,b:100},
    W:{a:'لوحدي',f:'صاحبي',e:'خطيبي / خطيبتي',b:'أخويا / أختي'},WD:{f:'خصم صاحب',e:'خصم خطيب/خطيبة',b:'خصم إخوات'},WO:{f:'صاحبه',e:'خطيبه/خطيبته',b:'أخوه/أخته'},
    K:{s:'طالب',g:'خريج'},
    PLANS:[['cash','💵 كاش'],['2w','📅 كل أسبوعين'],['1w','🗓️ كل أسبوع'],['eid','🎁 العيدية'],['mon','🗂️ الشهرية'],['pig','🐷 الحصّالة']]};
  var AD='٠١٢٣٤٥٦٧٨٩',MON=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  function ar(n){return String(n).replace(/\d/g,function(d){return AD[d]});}
  function money(n){n=Math.round(n||0);var s=String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'٬');return (n<0?'−':'')+ar(s);}
  function pd(s){var m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(s||'');return m?new Date(+m[1],m[2]-1,+m[3],12):new Date();}
  function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
  function addD(s,k){var d=pd(s);d.setDate(d.getDate()+k);return iso(d);}
  function today(){return iso(new Date());}
  function isoOf(ms){return ms?iso(new Date(ms)):today();}
  function dm(s){var d=pd(s);return ar(d.getDate())+' '+MON[d.getMonth()];}
  function nextSun(s){var d=pd(s);d.setDate(d.getDate()+(7-d.getDay())%7);return iso(d);}
  function ms(v){if(!v)return 0;if(typeof v==='number')return v;if(v.toMillis)return v.toMillis();if(v.seconds)return v.seconds*1000;return +new Date(v)||0;}
  function weeks(){var a=[],c=C.START;while(c<=C.END){a.push(c);c=addD(c,7);}return a;}
  function base(plan,k){var s=k!=='g';
    if(plan==='cash')return [[C.EARLY,(s?1400:1700)-C.DEP]];
    if(plan==='2w')return ['2026-11-22','2026-12-06','2026-12-20','2027-01-03'].map(function(d){return [d,s?275:350]});
    if(plan==='1w'||plan==='pig')return weeks().map(function(d){return [d,s?110:140]});
    if(plan==='eid')return weeks().map(function(d){return [d,(s?70:100)+(d==='2027-01-10'?400:0)]});
    if(plan==='mon')return [['2026-12-06',s?400:500],['2027-01-03',s?400:500],['2027-01-24',s?300:400]];
    return [];}
  function planDesc(plan,k){var s=k!=='g';return {cash:'مرة واحدة · قبل ٦ ديسمبر خصم ١٠٠ زيادة',
    '2w':ar(C.DEP)+' مقدم + ٤ أقساط × '+ar(s?275:350),'1w':ar(C.DEP)+' + ١٠ × '+ar(s?110:140),
    eid:ar(C.DEP)+' + ٤٠٠ يوم ١٠ يناير + ١٠ × '+ar(s?70:100),mon:ar(C.DEP)+' + '+(s?'٤٠٠ + ٤٠٠ + ٣٠٠':'٥٠٠ + ٥٠٠ + ٤٠٠'),
    pig:ar(C.DEP)+' وبعدها أي مبلغ كل أسبوع لحد ٢٤ يناير'}[plan]||'';}
  function round5(x){return Math.floor(x/5)*5;}
  /* b: {k,plan,late,at,w,pays:[{a,at}],dat,x}, o: {disc:number} → schedule */
  function calc(b,o){o=o||{};var T=o.today||today(),bd=isoOf(ms(b.at)),early=bd<=C.EARLY,k=b.k==='g'?'g':'s',plan=b.plan||'1w';
    var pays=(b.pays||[]).map(function(p){return {a:+p.a||0,at:ms(p.at),m:p.m||'',dep:!!p.dep}}).sort(function(a,c){return a.at-c.at});
    var paid=0;pays.forEach(function(p){paid+=p.a});
    var it=base(plan,k).map(function(x){return {d:x[0],a:x[1]}}),note=[],missed=0,missedN=0;
    if(plan==='cash'){if(!early)it=[{d:nextSun(addD(bd,1)),a:it[0].a}];}
    else{var rem=it.filter(function(x){return x.d>=bd}),gone=it.filter(function(x){return x.d<bd});
      gone.forEach(function(x){missed+=x.a});missedN=gone.length;
      if(!rem.length)rem=[{d:nextSun(addD(bd,1)),a:0}];
      if(missed){if(b.late==='now'){rem[0].a+=missed;}else{var per=round5(missed/rem.length),left=missed-per*rem.length;rem.forEach(function(x){x.a+=per});rem[rem.length-1].a+=left;}}
      it=rem;}
    var fee=early?0:100;if(fee){it[it.length-1].a+=fee;}
    // cash extra discount: booked early and fully paid by the end of 6 Dec (or 6 Dec not over yet)
    var cashD=0;if(plan==='cash'&&early){var full=(C.DEP+it[0].a)-100-(o.disc||0),by=0;pays.forEach(function(p){if(isoOf(p.at)<=C.EARLY)by+=p.a});
      if(T<=C.EARLY||by>=full){cashD=100;it[0].a-=100;}}
    var disc=o.disc||0,dl=disc;for(var i=it.length-1;i>=0&&dl>0;i--){var t=Math.min(dl,it[i].a);it[i].a-=t;dl-=t;}
    var items=[{d:bd,a:C.DEP,dep:1}].concat(it.filter(function(x){return x.a>0}));
    var total=0;items.forEach(function(x){total+=x.a});
    // allocate payments in order
    var left=paid;items.forEach(function(x){var t=Math.min(left,x.a);x.p=t;left-=t;x.done=t>=x.a;});
    var dueNow=0,lateAmt=0;items.forEach(function(x){if(x.d<=T||x.dep)dueNow+=x.a;});
    if(plan==='pig'){var ref=calc({k:k,plan:'1w',late:'spread',at:b.at,pays:[]},{today:T,disc:disc});dueNow=0;ref.items.forEach(function(x){if(x.d<=T||x.dep)dueNow+=x.a;});
      items=[items[0],{d:C.END,a:total-C.DEP,pig:1,p:Math.max(0,paid-C.DEP),done:paid>=total}];items[0].p=Math.min(paid,C.DEP);items[0].done=paid>=C.DEP;}
    var lateItems=[];
    if(plan==='pig'){var refPast=0,rr=calc({k:k,plan:'1w',late:'spread',at:b.at,pays:[]},{today:T,disc:disc});rr.items.forEach(function(x){if(!x.dep&&x.d<T)refPast+=x.a;});lateAmt=Math.max(0,refPast-Math.max(0,paid-C.DEP));}
    else{items.forEach(function(x){if(!x.dep&&x.d<T&&!x.done){lateItems.push(x);lateAmt+=x.a-x.p;}});}
    var next=null;for(var j=0;j<items.length;j++){if(!items[j].done&&(items[j].d>=T||items[j].dep)){next=items[j];break;}}
    return {items:items,total:total,paid:paid,left:Math.max(0,total-paid),dueNow:Math.max(0,dueNow-paid),late:lateAmt,lateItems:lateItems,next:next,early:early,fee:fee,cashD:cashD,disc:disc,missed:missed,missedN:missedN,bd:bd,dep:paid>=C.DEP||!!b.dat,done:paid>=total&&total>0,pays:pays};}
  function missedFor(plan,k,bd){if(plan==='cash'||plan==='pig')return {n:0,a:0};var L=base(plan,k).filter(function(x){return x[0]<bd}),a=0;L.forEach(function(x){a+=x[1]});return {n:L.length,a:a};}
  function priceFor(plan,k,bd,disc){var r=calc({k:k,plan:plan,late:'spread',at:pd(bd).getTime(),pays:[]},{today:bd,disc:disc||0});return r.total;}
  function norm(t){return String(t||'').replace(/[أإآا]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[ًٌٍَُِّْـ]/g,'').replace(/\s+/g,' ').trim();}
  return {C:C,ar:ar,money:money,dm:dm,iso:iso,pd:pd,today:today,isoOf:isoOf,ms:ms,calc:calc,planDesc:planDesc,missedFor:missedFor,priceFor:priceFor,norm:norm,nextSun:nextSun,addD:addD};
})();

</script>
<script>
(function(){
  var CFG={"apiKey": "AIzaSyCI2Joji2q_SrU1-TtRBEc1ZhgtbQNz95E", "authDomain": "abu-sefein-youth.firebaseapp.com", "projectId": "abu-sefein-youth", "storageBucket": "abu-sefein-youth.firebasestorage.app", "messagingSenderId": "884482612914", "appId": "1:884482612914:web:c5ec6c6eafacb26f7933ab"};

  var db=null;try{firebase.initializeApp(CFG);db=firebase.firestore();}catch(e){}

  function myLink(id){return location.origin+location.pathname+'?t='+id;}

  // ================= booking form

    if(bd()>C.END){var cl=el('div','card');cl.appendChild(el('div','cmp','الحجز قفل. لو محتاج حاجة كلّم أبانوب.'));app.appendChild(cl);return;}
    if(F.step===1)step1();else step2();}
  function step1(){var c=el('div','card');
    c.appendChild(el('label','lb','اسمك بالكامل'));var n=el('input');n.id='f-n';n.value=F.n;n.maxLength=60;n.placeholder='الاسم التلاتي';n.autocomplete='name';c.appendChild(n);
    c.appendChild(el('label','lb','رقم موبايلك'));var p=el('input','ltr');p.id='f-ph';p.value=F.ph;p.inputMode='tel';p.placeholder='01xxxxxxxxx';p.maxLength=14;c.appendChild(p);
    c.appendChild(el('label','lb','انت'));var kc=el('div','chips');[['s','🎓 طالب'],['g','💼 خريج']].forEach(function(x){var b=bt(F.k===x[0]?'on':'',x[1],function(){F.n=n.value;F.ph=p.value;F.k=x[0];drawForm();});kc.appendChild(b);});c.appendChild(kc);
    c.appendChild(el('label','lb','جاي مع مين؟'));var wc=el('div','chips');['a','f','e','b'].forEach(function(k){var b=bt(F.w===k?'on':'',C.W[k],function(){F.n=n.value;F.ph=p.value;F.w=k;drawForm();});wc.appendChild(b);});c.appendChild(wc);
    var wn=null;if(F.w&&F.w!=='a'){wn=el('input');wn.id='f-wn';wn.style.marginTop='8px';wn.value=F.wn;wn.maxLength=60;wn.placeholder='اسم '+({f:'صاحبك',e:'خطيبك/خطيبتك',b:'أخوك/أختك'})[F.w]+' بالكامل';c.appendChild(wn);
      c.appendChild(el('div','hint','🎁 '+C.WD[F.w]+' '+ar(C.DISC[F.w])+' جنيه ليك وله، بيتشال من آخر قسط — أول ما '+({f:'صاحبك',e:'خطيبك/خطيبتك',b:'أخوك/أختك'})[F.w]+' يحجز ويدفع المقدم.'));}
    var er=el('div','err');c.appendChild(er);
    c.appendChild(bt('btn','التالي: اختار طريقة الدفع ‹',function(){F.n=n.value.trim().replace(/\s+/g,' ');F.ph=en(p.value).replace(/\D/g,'');if(wn)F.wn=wn.value.trim().replace(/\s+/g,' ');
      if(F.n.split(' ').length<2){er.textContent='اكتب اسمك التلاتي';n.classList.add('bad');n.focus();return;}
      if(!/^01[0125]\d{8}$/.test(F.ph)){er.textContent='رقم الموبايل لازم يكون ١١ رقم ويبدأ بـ ٠١';p.classList.add('bad');p.focus();return;}
